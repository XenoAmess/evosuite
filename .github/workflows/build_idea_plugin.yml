name: IDE Plugins CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  plugins-build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ ubuntu-latest , windows-latest ]
        java: [ 21 ]
        experimental: [ false ]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Build
        run: |
          ./mvnw --version
          ./mvnw -B -ntp clean install -DskipTests -DskipITs
      - name: Build eclipse plugin
        run: |
          ./mvnw -B -ntp -f plugins/eclipse/pom.xml clean install -DskipTests -DskipITs
      - name: Build intellij plugin
        run: |
          cd ./plugins/intellij
          chmod 777 ./gradlew
          ./gradlew buildPlugin -s
      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v7
        with:
          name: p3c-idea-plugin-${{ matrix.os }}-${{ matrix.java }}
          path: plugins/intellij/build/distributions/*.zip
          if-no-files-found: warn
